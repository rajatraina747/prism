# Pinned versions + SHA-256 of every third-party binary Prism bundles.
#
# Consumed by scripts/fetch-sidecars.sh (CI and local builds). Refresh with
# scripts/update-sidecars.sh, review the diff, and commit — a release must
# never pick up whatever "latest" happens to be at build time, because the
# minisign-signed updater then vouches for it on every user's machine.
#
# Format: plain KEY=VALUE lines, sourced by bash.

# yt-dlp — https://github.com/yt-dlp/yt-dlp/releases (hashes from SHA2-256SUMS)
YTDLP_VERSION=2026.08.19
# The "onedir" builds (a folder, unpacked once when Prism is installed), not
# the one-file ones: those unpack ~70 MB into a temp folder on every single
# run, which cost ~5 s per lookup and per download on macOS (REVIEW 2026-09-26).
YTDLP_ZIP_SHA256_MACOS=07e54b0865303c864006925913bce2604f8ee8cc6f18699bac9c309f9328a6d8
YTDLP_ZIP_SHA256_LINUX=32e72032766bef9199d99d15beb69fd52e46df8f8b06f0d8745db59e04d339e9
YTDLP_ZIP_SHA256_WINDOWS=30b4c14aafab6082becff7881e41b76df46dc43ea7633479410a91e29da492bf

