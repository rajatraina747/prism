# LGPL media toolchain for macOS arm64 — libmpv, ffmpeg and ffprobe built from
# pinned sources by scripts/build-media-macos.sh and published by
# .github/workflows/media-toolchain.yml. This replaces the Homebrew libmpv
# bundle, which had no stable URL to pin (the last open piece of S-5) and made
# the macOS build GPL.
#
# prism-media-sources.tar.gz on the same release is the corresponding source
# for the LGPL written offer: every upstream tarball byte for byte, next to the
# script that patches and builds them. Keep it pinned so the offer can always
# be honoured with exactly what these binaries were built from.
MEDIA_MACOS_ARM64_URL=https://github.com/rajatraina747/prism/releases/download/media-toolchain-20260916/prism-media-macos-arm64.tar.xz
MEDIA_MACOS_ARM64_SHA256=b6c173509e61d25ea95984b02f61adc00a1079fde9bbbba89e7d2611520c9f50
MEDIA_MACOS_ARM64_SOURCES_URL=https://github.com/rajatraina747/prism/releases/download/media-toolchain-20260916/prism-media-sources.tar.gz
MEDIA_MACOS_ARM64_SOURCES_SHA256=4bb9497c6f6f0d3747914466a1cbba15fca50c2ea5d5c60c38ba4198ffa54aa6

# ffmpeg for Windows and Linux — BtbN's LGPL builds,
# https://github.com/BtbN/FFmpeg-Builds (hashes from the release's
# checksums.sha256). Pinned to a dated autobuild tag: `latest` there is a
# rolling tag and would silently change what a release ships.
#
# The 8.1 branch on purpose — it is the same ffmpeg the macOS toolchain builds
# (8.1.x), so a bug report means the same thing on every platform. Shared
# rather than static: the static build is roughly twice the size for the same
# two programs, and the libraries travel with them.
BTBN_TAG=autobuild-2026-11-01-12-49
BTBN_FFMPEG_WIN64=ffmpeg-n8.1.3-29-gad3b795b72-win64-lgpl-shared-8.1.zip
BTBN_FFMPEG_WIN64_SHA256=786b43f77ea260af71fbb1bcdaabd43df83492122fb5575027f659d490d30b37
BTBN_FFMPEG_LINUX64=ffmpeg-n8.1.3-29-gad3b795b72-linux64-lgpl-shared-8.1.tar.xz
BTBN_FFMPEG_LINUX64_SHA256=bcf24617e957f296e763e9f5d208065f27483f07aba433bc09d573f4d483c7fe
