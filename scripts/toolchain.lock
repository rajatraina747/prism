# Pinned sources for the LGPL media toolchain (macOS arm64), consumed by
# scripts/build-media-macos.sh and .github/workflows/media-toolchain.yml.
#
# Every URL is fetched and checked against its SHA-256 before building. An
# empty SHA is only accepted in a bootstrap run (PRISM_TOOLCHAIN_BOOTSTRAP=1),
# which prints the computed value and then fails, so it can't be released.
# Review the printed pins, fill them in here and commit.
#
# Format: plain KEY=VALUE lines, sourced by bash.

# FFmpeg — https://ffmpeg.org/releases/ (LGPL build: no --enable-gpl/nonfree)
