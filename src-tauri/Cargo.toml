[package]
name = "prism"
version = "2.0.1"
description = "Prism — Premium Video Downloader"
authors = ["RainaCorp"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["sync", "time", "process", "io-util", "fs", "net", "rt"] }
opener = "0.7"
# Scheme validation for the outbound-link command (see open_external).
url = "2"
regex = "1"
chrono = "0.4"
dirs = "6"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "socks"] }  # socks: RSS polls honour a SOCKS proxy (already enabled by librqbit)
sha2 = "0.10"
sentry = { version = "0.48", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
anyhow = "1"
# BitTorrent second-engine spike (go/no-go). See ROADMAP.md.
librqbit = "9"
# Loopback server that streams a torrent's file to the player while it is still
# downloading (see src/stream_server.rs). Both already come in with librqbit,
# so naming them directly adds no new build weight.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio-util = { version = "0.7", features = ["io"] }
# The stream server's per-launch token. Already in the tree under librqbit and
# rustls; taken directly rather than pulling in a whole RNG for 32 bytes.
getrandom = "0.3"
# In-app player engine (embeds mpv). Vendored with a resource-dir search
# patch so releases can bundle libmpv — see vendor/tauri-plugin-libmpv/README.md.
tauri-plugin-libmpv = { path = "vendor/tauri-plugin-libmpv" }
# Bulk delete puts files in the OS Trash rather than unlinking them: the one
# place Prism removes a finished download, so it has to be recoverable.
trash = "5.2.3"
# Arbitrary RSS/Atom feeds — podcasts and torrent feeds, whose enclosures are
# files rather than pages. yt-dlp still handles channel and playlist URLs.
feed-rs = "2.4.0"
# Opt-in global hotkeys (add from clipboard, show Prism, pause all).
tauri-plugin-global-shortcut = "2.3.2"

# Signalling yt-dlp's process tree on kill (see src/proc.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows has no process groups: a run is kept in a Job Object instead, so one
# handle close takes the whole tree with it (see src/spawn.rs). Already in the
# tree by way of Tauri's own dependencies.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  # CreateJobObjectW names SECURITY_ATTRIBUTES in its signature, so the
  # module doesn't compile without this even though we pass null.
  "Win32_Security",
] }

# macOS: patch mpv's --wid subview after init (fill, autoresize, z-order) —
# see src/player.rs for why. Versions match the ones already in tauri's tree.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = "0.3"

# Tests drive the real capability files through Tauri's mock runtime (IPC +
# ACL) — see `webview_fs_access_*` in src/lib.rs.
[dev-dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "test"] }
# Local HTTP server for the direct-download engine tests.
tokio = { version = "1", features = ["net"] }

# Dev-only: examples/mpv_thread_repro.rs, a standalone verification harness
# for the commands.rs main-thread patch (not part of the shipped app).
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
libloading = "0.8"
