name: Bug report
description: Something in Prism doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Found a security issue? Please report it
        privately instead — see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Prism version
      description: Settings → About
      placeholder: "1.9.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - Windows
        - Linux (AppImage)
        - Linux (.deb / .rpm)
        - Web demo
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What were you doing?
      options:
        - Downloading from a video site
        - Downloading a torrent / magnet
        - Playing a file in Prism
        - Subscriptions
        - Settings, updates or something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If a particular site or link triggers it, say which site. Only share links you're comfortable making public.
      placeholder: |
        1. Paste …
        2. Choose 1080p
        3. …
  - type: textarea
    id: logs
    attributes:
      label: Error message or logs
      description: The failure text from the Transfers row, or Settings → Diagnostics → Export logs. Logs can contain links and file paths — remove anything private.
      render: text
