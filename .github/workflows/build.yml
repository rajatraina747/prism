name: Build & Release

on:
  push:
    tags: ['v*']

# Read-only by default; only the jobs that publish to the draft release get
# write access (S-10).
permissions:
  contents: read

# Every third-party binary that ends up inside a release (yt-dlp, Deno,
# libmpv-wrapper, libmpv) is pinned by version AND SHA-256 in
# scripts/sidecars.lock and fetched through scripts/fetch-sidecars.sh, which
# refuses to continue on a mismatch. The minisign-signed updater vouches for
# whatever we ship, so "latest at build time" is not acceptable here.
#
# Actions are pinned to commit SHAs (tag noted for humans).
jobs:
  # Read RELEASE_NOTES.md once so all three build jobs publish the same body.
  # (They race to write the release; whichever finishes last wins, so the body
  # must be identical — previously it was copy-pasted ×3 and went stale.)
  notes:
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.read.outputs.body }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read release notes
        id: read
        # The leading <!-- --> header is instructions for editors, not release
        # content — strip it so it doesn't show in the in-app updater notes.
        # A "Bundled components" footer is appended from sidecars.lock so every
        # release states exactly which third-party versions it carries.
        run: |
          source scripts/sidecars.lock
          {
            echo 'body<<RELEASE_NOTES_EOF'
            awk 'NR==1 && /^<!--/ {skip=1} skip {if (/^-->/) skip=0; next} !p && /^[[:space:]]*$/ {next} {p=1; print}' RELEASE_NOTES.md
            echo
            echo '## Bundled components'
            echo
            echo "- yt-dlp ${YTDLP_VERSION} (self-updatable from Settings)"
            echo "- Deno ${DENO_VERSION}"
            echo "- libmpv-wrapper ${LIBMPV_WRAPPER_VERSION}"
            echo "- libmpv: Windows — zhongfly/mpv-winbuild ${MPV_WINBUILD_TAG} (LGPL build); macOS — Homebrew mpv (exact versions in the bundle's resources/lib/VERSIONS.txt)"
            echo
            echo 'All pinned and checksum-verified at build time — see scripts/sidecars.lock.'
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

  build-macos:
    needs: notes
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Embedded player and media tools: the LGPL toolchain built from pinned
      # sources by .github/workflows/media-toolchain.yml, fetched by SHA-256
      # and unpacked into resources/lib (tauri.macos.conf.json), together with
      # the pinned libmpv-wrapper. Nothing comes from Homebrew any more, so
      # there are no player build tools to install.
      - name: Fetch pinned, checksum-verified sidecars + player libraries
        run: scripts/fetch-sidecars.sh macos --player

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Empty until the key is re-encrypted — see docs/RELEASE-KEYS.md.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional: bakes in opt-in crash reporting; empty/missing = disabled
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Ad-hoc sign so macOS doesn't show "damaged" error on downloaded apps
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tauriScript: npx tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'Prism ${{ github.ref_name }}'
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  build-windows:
    needs: notes
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Embedded player: wrapper DLL + zhongfly's LGPL libmpv under resources
      # lib/ — both DLLs must land in the SAME directory (the wrapper resolves
      # libmpv by bare name; the vendored plugin pre-loads it from beside the
      # wrapper, see vendor/tauri-plugin-libmpv/src/desktop.rs).
      - name: Fetch pinned, checksum-verified sidecars + player libraries
        shell: bash
        run: scripts/fetch-sidecars.sh windows --player

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Empty until the key is re-encrypted — see docs/RELEASE-KEYS.md.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional: bakes in opt-in crash reporting; empty/missing = disabled
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        with:
          tauriScript: npx tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'Prism ${{ github.ref_name }}'
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  build-linux:
    needs: notes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Fetch pinned, checksum-verified sidecars
        run: scripts/fetch-sidecars.sh linux

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Empty until the key is re-encrypted — see docs/RELEASE-KEYS.md.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional: bakes in opt-in crash reporting; empty/missing = disabled
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        with:
          tauriScript: npx tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'Prism ${{ github.ref_name }}'
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
