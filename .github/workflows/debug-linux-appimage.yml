# TEMPORARY — delete once the Linux AppImage build is fixed.
#
# Build & Release only triggers on `v*` tags, so every attempt at the AppImage
# break costs a release candidate. This runs the same Linux build off a branch
# instead, and its whole purpose is to make linuxdeploy talk: tauri pipes the
# bundler's output and only prints it under --verbose, which is why the release
# log says nothing but `failed to run linuxdeploy`.
name: Debug Linux AppImage

on:
  workflow_dispatch:
  push:
    branches: [debug/linux-appimage]

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Fetch pinned, checksum-verified sidecars
        run: scripts/fetch-sidecars.sh linux --player

      # v1.9.2's AppImage built on this same runner image in 85 s. The one
      # thing 2.0 adds is this tree, so record exactly what goes in.
      - name: What the bundle now carries that 1.9.2 did not
        run: |
          echo "── src-tauri/lib ──"
          find src-tauri/lib -maxdepth 3 | sort
          echo "── ELF types ──"
          file src-tauri/lib/bin/* 2>/dev/null || true
          echo "── symlinks (cp -a preserves the .so version chains) ──"
          find src-tauri/lib -type l -ls 2>/dev/null || true
          echo "── rpath on ffmpeg (expect \$ORIGIN/../lib) ──"
          readelf -d src-tauri/lib/bin/ffmpeg 2>/dev/null | grep -Ei 'rpath|runpath' || true
          echo "── runpath on each real .so (expect \$ORIGIN on every one) ──"
          for so in src-tauri/lib/lib/*.so.*.*.*; do
            [ -f "$so" ] || continue
            printf '%s\t%s\n' "$(basename "$so")" \
              "$(readelf -d "$so" 2>/dev/null | grep -Eio 'R(UN)?PATH.*' || echo 'NONE')"
          done

      - name: Build (verbose; allowed to fail so the next step can run)
        id: build
        continue-on-error: true
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        run: npx tauri build --verbose

      # The build step is allowed to fail so this one always runs, which means
      # the job's own green tick proves nothing — this is the real gate.
      - name: Did an AppImage actually come out
        if: always()
        run: |
          BUNDLE=src-tauri/target/release/bundle/appimage
          echo "── bundle dir ──"
          ls -la "$BUNDLE" 2>/dev/null || { echo "no appimage bundle dir at all"; exit 1; }
          IMG=$(find "$BUNDLE" -maxdepth 1 -name '*.AppImage' | head -1)
          if [ -z "$IMG" ]; then
            echo "✗ no .AppImage — linuxdeploy still refused. The AppDir it left:"
            find "$BUNDLE" -maxdepth 1 -name '*.AppDir' -exec find {} -maxdepth 4 \; | sort | head -60
            # linuxdeploy is cached outside the bundle dir; run it by hand so
            # its stderr reaches the log uncaptured.
            LD=$HOME/.cache/tauri/linuxdeploy-x86_64.AppImage
            APPDIR=$(find "$BUNDLE" -maxdepth 1 -name '*.AppDir' | head -1)
            if [ -x "$LD" ] && [ -n "$APPDIR" ]; then
              echo "── linuxdeploy, direct ──"
              APPIMAGE_EXTRACT_AND_RUN=1 NO_STRIP=true "$LD" --appdir "$APPDIR" --output appimage || true
            fi
            exit 1
          fi
          echo "✓ $IMG ($(du -h "$IMG" | cut -f1))"
          # An AppImage that exists but ships an ffmpeg that cannot find its
          # own libraries is not a fix. Unpack and check the relationship the
          # staging comment promises: resources/lib/bin/ffmpeg → ../lib.
          cd "$BUNDLE" && "./$(basename "$IMG")" --appimage-extract >/dev/null 2>&1 || true
          FF=$(find squashfs-root -path '*/lib/bin/ffmpeg' | head -1)
          echo "bundled ffmpeg: ${FF:-NOT FOUND}"
          if [ -n "$FF" ]; then
            chmod +x "$FF"
            echo "── ldd ──"; ldd "$FF" | grep -E 'libav|libsw' || true
            echo "── it runs ──"; "$FF" -hide_banner -version | head -2
          fi
