name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token for every job; nothing here publishes anything.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Actions are pinned to commit SHAs (the tag is noted for humans). Bump the
# SHA deliberately, not by letting a floating tag move under a release.
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit & component tests
        run: npm test

      - name: Build frontend
        run: npm run build

  # End-to-end tests against the web demo (mock service) in real Chromium:
  # routing, Settings semantics, the Add sheet, the windowed Library.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npx playwright test --reporter=line
        env:
          CI: "true"

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      # tauri-build requires the frontend dist and sidecar binaries to exist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci && npm run build

      - name: Fetch pinned, checksum-verified sidecars
        run: scripts/fetch-sidecars.sh linux

      - name: Clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

  # The Linux job never compiles the macOS-only player integration (objc
  # window adoption) or the Windows process/DLL paths. Type-check those on
  # their own platforms so a cfg-gated compile error can't reach a tag.
  rust-cross-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci && npm run build

      - name: Fetch pinned, checksum-verified sidecars
        shell: bash
        run: scripts/fetch-sidecars.sh ${{ matrix.platform }}

      # tauri-build resolves the `lib/**/*` resource glob at compile time and
      # fails if nothing matches. This job type-checks; it doesn't assemble the
      # player libraries (release builds do), so give the glob one file.
      - name: Stage placeholder player resources
        shell: bash
        run: mkdir -p src-tauri/lib && echo "placeholder for cargo check; release builds bundle the real libmpv tree" > src-tauri/lib/PLACEHOLDER.txt

      - name: Clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  # `fetch-sidecars.sh macos --player` is what turns the published LGPL
  # toolchain into the bundle's resources/lib, and build.yml only runs on tags —
  # so without this job nothing exercises that path until a release is being
  # cut, which is the worst moment to find out. It re-checks here what the
  # toolchain build checked at the other end: nothing GPL, nothing from the
  # machine it was built on. macos-latest is arm64, the toolchain's target.
  media-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch the pinned player libraries and media tools
        run: scripts/fetch-sidecars.sh macos --player

      - name: Check what actually landed
        run: |
          set -euo pipefail
          test -f src-tauri/lib/libmpv.dylib
          test -f src-tauri/lib/libmpv-wrapper.dylib
          test -f src-tauri/lib/libMoltenVK.dylib
          test -f src-tauri/lib/vulkan/icd.d/MoltenVK_icd.json
          test -x src-tauri/lib/bin/ffmpeg
          test -x src-tauri/lib/bin/ffprobe

          # LGPL, read off the binary rather than trusting the flags we passed.
          buildconf="$(src-tauri/lib/bin/ffmpeg -hide_banner -buildconf)"
          if echo "$buildconf" | grep -qE -- '--enable-(gpl|nonfree)'; then
            echo "✗ bundled ffmpeg is not an LGPL build" >&2; exit 1
          fi
          if src-tauri/lib/bin/ffmpeg -hide_banner -L | grep -qi 'GNU General Public License'; then
            echo "✗ bundled ffmpeg reports a GPL license" >&2; exit 1
          fi

          # The GPL codecs the old Homebrew bundle carried must be gone, and
          # nothing may resolve to a library on the build machine.
          if otool -L src-tauri/lib/*.dylib src-tauri/lib/bin/* | grep -qiE 'x264|x265|rubberband'; then
            echo "✗ a GPL codec is linked into the bundle" >&2; exit 1
          fi
          if otool -L src-tauri/lib/*.dylib src-tauri/lib/bin/* | grep -qE '/opt/homebrew|/usr/local/(lib|opt)'; then
            echo "✗ bundled media libraries reference the build machine" >&2; exit 1
          fi

          src-tauri/lib/bin/ffprobe -hide_banner -version | head -1
          cat src-tauri/lib/VERSIONS.txt

  # Windows and Linux get BtbN's LGPL ffmpeg the same way macOS gets the
  # toolchain Prism builds, and build.yml only runs on tags — so the staging is
  # proved here rather than while a release is being cut. Starting the binary is
  # the real check: a shared build whose libraries didn't travel with it fails
  # exactly here, which is the mistake this would otherwise ship.
  media-windows-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            exe: .exe
          - os: ubuntu-latest
            platform: linux
            exe: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch the pinned media tools
        shell: bash
        run: scripts/fetch-sidecars.sh ${{ matrix.platform }} --player

      - name: Check what actually landed
        shell: bash
        run: |
          set -euo pipefail
          ff="src-tauri/lib/bin/ffmpeg${{ matrix.exe }}"
          probe="src-tauri/lib/bin/ffprobe${{ matrix.exe }}"
          test -f "$ff"
          test -f "$probe"

          # ffplay is deliberately left behind.
          if ls src-tauri/lib/bin/ffplay* >/dev/null 2>&1; then
            echo "✗ ffplay was bundled" >&2; exit 1
          fi

          # Both have to start — on Linux that also proves the shared
          # libraries were staged where the rpath expects them.
          "$probe" -hide_banner -version | head -1

          # LGPL, read off the binary rather than trusting the asset name.
          if "$ff" -hide_banner -buildconf | grep -qE -- '--enable-(gpl|nonfree)'; then
            echo "✗ bundled ffmpeg is not an LGPL build" >&2; exit 1
          fi
          if "$ff" -hide_banner -L | grep -qi 'GNU General Public License'; then
            echo "✗ bundled ffmpeg reports a GPL license" >&2; exit 1
          fi

          cat src-tauri/lib/VERSIONS.txt

  # The per-release checklist from docs/AUDIT-2026-07.md, enforced.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          cache-bin: true

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit
